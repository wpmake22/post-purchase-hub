name: Compatibility matrix

# The full matrix from docs/SPEC.md Phase 15: PHP 8.1-8.4 x WP 6.5/latest x
# HPOS on/off. Costly enough that it runs on request only — before a release
# (M16/M17), after touching order storage, or when a compatibility bug is
# reported. Everyday coverage is ci.yml's two-leg subset.
on:
  workflow_dispatch:
    inputs:
      php:
        description: 'PHP versions (JSON array)'
        default: '["8.1","8.2","8.3","8.4"]'
      wp:
        description: 'WordPress versions (JSON array)'
        default: '["6.5","latest"]'

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: 1

jobs:
  unit:
    name: Unit / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON( inputs.php ) }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: composer test:unit

  integration:
    name: Integration / PHP ${{ matrix.php }} / WP ${{ matrix.wp }} / HPOS ${{ matrix.hpos }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON( inputs.php ) }}
        wp: ${{ fromJSON( inputs.wp ) }}
        hpos: ['on', 'off']
        exclude:
          # WordPress 6.5 predates PHP 8.4 support; the pairing is not a supported store configuration.
          - php: '8.4'
            wp: '6.5'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Compose the wp-env config for this matrix leg
        run: |
          node -e "
            const fs = require('fs');
            const base = JSON.parse(fs.readFileSync(process.env.BASE, 'utf8'));
            base.core = JSON.parse(process.env.CORE);
            base.phpVersion = process.env.PHPV;
            fs.writeFileSync('.wp-env.ci.json', JSON.stringify(base, null, 2));
          "
          cat .wp-env.ci.json
        env:
          PHPV: ${{ matrix.php }}
          BASE: ${{ matrix.hpos == 'on' && '.wp-env.hpos.json' || '.wp-env.json' }}
          CORE: ${{ matrix.wp == 'latest' && 'null' || format('"https://wordpress.org/wordpress-{0}.zip"', matrix.wp) }}

      - name: Start wp-env
        run: npx wp-env start --update --config .wp-env.ci.json

      - name: Assert the HPOS state this leg expects
        run: |
          ACTUAL=$(npx wp-env run tests-cli --config .wp-env.ci.json wp option get woocommerce_custom_orders_table_enabled --quiet | tr -d '\r\n')
          EXPECTED=$([ "${{ matrix.hpos }}" = "on" ] && echo yes || echo no)
          echo "HPOS expected=$EXPECTED actual=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Run the integration suite
        run: npx wp-env run tests-cli --config .wp-env.ci.json --env-cwd=wp-content/plugins/post-purchase-hub vendor/bin/phpunit --configuration phpunit-integration.xml.dist

      - name: Dump the debug log on failure
        if: failure()
        run: npx wp-env run tests-cli --config .wp-env.ci.json cat wp-content/debug.log || true
