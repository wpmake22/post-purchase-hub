name: CI

# Runs on every pull request and every push to main. Kept deliberately small:
# this repository is private on a plan with a monthly minute allowance, so the
# full compatibility matrix lives in compat.yml and runs on request instead.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: 1

jobs:
  # One job rather than four: billing rounds up to the minute per job, and these
  # four checks share the same checkout, Composer install and npm install.
  static:
    name: Lint, analyse, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The edition boundary, checked before anything slower. A core file that
      # names an edition namespace or asks which edition it is running in has
      # already broken the architecture, and no later test would notice.
      - name: Edition boundary
        run: |
          FAIL=0

          # One-or-more backslashes: `use PostPurchaseHub\Pro\X` in code and
          # 'PostPurchaseHub\\Pro\\X' inside a string are both leaks, and a
          # pattern that only matched one of them would be a gate in name only.
          if grep -rnE 'PostPurchaseHub\\+(Pro|Free)\\+' src/ post-purchase-hub.php; then
            echo "::error::Core references an edition namespace. Core registers extension points; editions fill them."
            FAIL=1
          fi

          if grep -rn 'pph_is_pro' src/; then
            echo "::error::Core branches on edition. If Pro cannot be built on core's public surface, the surface is wrong."
            FAIL=1
          fi

          if grep -rnE '#if__(PREMIUM|FREE)' src/ free/ pro/; then
            echo "::error::Inline build marker found. Editions are separated by directory, never by marker."
            FAIL=1
          fi

          exit $FAIL

      - run: composer lint
      - run: composer analyse

      # Twice: core alone, then core with pro/ present. Pro must not change core
      # behaviour except where a documented filter says it does, and the free
      # artifact is core alone — so core alone is what has to pass first.
      - name: Unit suite, core only
        run: |
          mv pro /tmp/pro-edition
          composer dump-autoload --quiet
          composer test:unit
          mv /tmp/pro-edition pro
          composer dump-autoload --quiet

      - name: Unit suite, core plus pro
        run: composer test:unit

      - run: npm ci
      - run: npm run build

  # Two legs, chosen to cover both order-storage engines and both ends of the
  # supported PHP range. Every other combination is compat.yml's job.
  integration:
    name: Integration / PHP ${{ matrix.php }} / HPOS ${{ matrix.hpos }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Gated on the cheap job: code that does not lint or type-check is not worth
    # spending Docker minutes on.
    needs: static
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            hpos: 'off'
          - php: '8.4'
            hpos: 'on'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # The HPOS leg differs only in its lifecycle script, so the leg is a whole generated config.
      - name: Compose the wp-env config for this matrix leg
        run: |
          node -e "
            const fs = require('fs');
            const base = JSON.parse(fs.readFileSync(process.env.BASE, 'utf8'));
            base.phpVersion = process.env.PHPV;
            fs.writeFileSync('.wp-env.ci.json', JSON.stringify(base, null, 2));
          "
          cat .wp-env.ci.json
        env:
          PHPV: ${{ matrix.php }}
          BASE: ${{ matrix.hpos == 'on' && '.wp-env.hpos.json' || '.wp-env.json' }}

      - name: Start wp-env
        run: npx wp-env start --update --config .wp-env.ci.json

      - name: Assert the HPOS state this leg expects
        run: |
          ACTUAL=$(npx wp-env run tests-cli --config .wp-env.ci.json wp option get woocommerce_custom_orders_table_enabled --quiet | tr -d '\r\n')
          EXPECTED=$([ "${{ matrix.hpos }}" = "on" ] && echo yes || echo no)
          echo "HPOS expected=$EXPECTED actual=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Run the integration suite
        run: npx wp-env run tests-cli --config .wp-env.ci.json --env-cwd=wp-content/plugins/post-purchase-hub vendor/bin/phpunit --configuration phpunit-integration.xml.dist

      - name: Dump the debug log on failure
        if: failure()
        run: npx wp-env run tests-cli --config .wp-env.ci.json cat wp-content/debug.log || true
